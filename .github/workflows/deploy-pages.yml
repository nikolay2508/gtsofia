name: Deploy GitHub Pages

on:
  # Deploy ordinary commits to main.
  push:
    branches:
      - main

  # Crucial for Update transport data: a GITHUB_TOKEN push does not create
  # another push-triggered workflow, but workflow_run is emitted when the
  # producing workflow finishes.
  workflow_run:
    workflows:
      - Update transport data
    types:
      - completed

  # Allow manual deployments from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      # A rerun of this job keeps artifacts from the previous attempt.
      # Remove them first because deploy-pages requires exactly one artifact
      # named 'github-pages' for this workflow run.
      - name: Remove previous Pages artifacts from this run
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const artifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              { owner, repo, run_id: context.runId, per_page: 100 }
            );

            const staleArtifacts = artifacts.filter(
              artifact => artifact.name === 'github-pages'
            );

            for (const artifact of staleArtifacts) {
              core.info(`Deleting stale Pages artifact ${artifact.id}`);
              await github.rest.actions.deleteArtifact({
                owner,
                repo,
                artifact_id: artifact.id,
              });
            }

            core.info(`Removed ${staleArtifacts.length} stale Pages artifact(s).`);

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
